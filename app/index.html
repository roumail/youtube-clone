<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kids Library</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/shaka-player-5.3.5.compiled.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- data-testid / data-state names are the app ↔ test contract (DESIGN.md §7). -->
  <div id="app" data-testid="app" data-ready="false">

    <section data-testid="screen-library" data-state="empty" hidden>
      <header>
        <h1>Library</h1>
        <button type="button" data-testid="add-video-button">Add video</button>
        <button type="button" data-testid="settings-button">Settings</button>
      </header>
      <p class="empty-note">No videos yet.</p>
      <ul class="grid" data-role="library-grid"></ul>
      <input type="file" data-testid="import-input" multiple hidden>
      <div data-testid="import-status" data-import="idle"></div>
    </section>

    <section data-testid="screen-player" data-state="loading" hidden>
      <header><button type="button" data-testid="back-button">Back</button></header>
      <video data-testid="player-video" playsinline disablepictureinpicture disableremoteplayback></video>
      <div class="controls">
        <button type="button" data-testid="play-button">Play</button>
        <button type="button" data-testid="pause-button">Pause</button>
      </div>
      <p class="error-note">This video isn't in the library.</p>
    </section>

    <section data-testid="screen-settings" data-state="locked" hidden>
      <header>
        <button type="button" data-testid="back-button">Back</button>
        <h1>Settings</h1>
      </header>
      <button type="button" data-testid="change-pin-button">Change PIN</button>
      <ul data-role="settings-list"></ul>
    </section>

    <div data-testid="pin-prompt" data-mode="verify" data-state="entry" role="dialog" aria-modal="true" hidden>
      <form class="pin-card">
        <h2 data-role="pin-title">Enter PIN</h2>
        <input data-testid="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="6">
        <p data-testid="pin-error" hidden></p>
        <div class="pin-actions">
          <button type="button" data-testid="pin-cancel">Cancel</button>
          <button type="submit" data-testid="pin-submit">OK</button>
        </div>
      </form>
    </div>

  </div>
</body>
</html>
