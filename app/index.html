<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com https://docs.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Kids Library</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/shaka-player-5.3.5.compiled.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- data-testid / data-state names are the app ↔ test contract. -->
  <div id="app" data-testid="app" data-ready="false">

    <section data-testid="screen-library" data-state="empty" hidden>
      <header>
        <h1>Library <span class="app-version" data-testid="app-version">dev</span></h1>
        <button type="button" data-testid="add-video-button">Add video</button>
        <button type="button" data-testid="add-from-drive-button" hidden>Add from Google Drive</button>
        <button type="button" data-testid="settings-button">Settings</button>
      </header>
      <p class="import-help" data-testid="import-help">Adding a video? Pick its <strong>.kidsvideo</strong> file. Videos are prepared on the Mac first.</p>
      <!-- Search (M10): typing needs the PIN; clearing is free. -->
      <div class="search">
        <input type="search" data-testid="search-input" data-state="locked" readonly autocomplete="off" placeholder="Search (needs PIN)" aria-label="Search the library">
        <button type="button" data-testid="search-clear" aria-label="Clear search" hidden>✕</button>
      </div>
      <p class="empty-note">No videos yet.</p>
      <p class="search-empty" data-testid="search-empty" hidden>No videos match.</p>
      <ul class="grid" data-role="library-grid"></ul>
      <input type="file" data-testid="import-input" multiple hidden>
      <!-- One row per add or download (data-testid="import-status"), made in app.js -->
      <ul class="jobs" data-role="jobs"></ul>
    </section>

    <section data-testid="screen-series" hidden>
      <header>
        <button type="button" data-testid="back-button">Back</button>
        <h1 data-role="series-title"></h1>
      </header>
      <ul class="grid" data-role="episode-grid"></ul>
    </section>

    <!-- Selecting videos to play in a row: shown on the library and series screens. -->
    <div class="selection-bar" data-testid="selection-bar" hidden>
      <span data-testid="selection-count"></span>
      <button type="button" data-testid="selection-cancel">Cancel</button>
      <button type="button" data-testid="selection-play">Play</button>
    </div>

    <section data-testid="screen-player" data-state="loading" hidden>
      <header><button type="button" data-testid="back-button">Back</button></header>
      <video data-testid="player-video" playsinline disablepictureinpicture disableremoteplayback></video>
      <div class="seek" data-role="seek">
        <span data-testid="time-elapsed">00:00</span>
        <input type="range" data-testid="seek-bar" min="0" max="0" step="1" value="0" aria-label="Position in the video">
        <span data-testid="time-total">00:00</span>
      </div>
      <div class="controls">
        <button type="button" data-testid="play-button">Play</button>
        <button type="button" data-testid="pause-button">Pause</button>
      </div>
      <p class="error-note" data-testid="player-error">This video isn't in the library.</p>
      <!-- Optional feature "watchTimeLimit" (features/watch-time.js) -->
      <div class="session-bar" data-testid="session-bar" hidden>
        <span data-testid="session-time" data-seconds="0"></span>
        <span data-testid="session-remaining"></span>
        <span data-testid="clock"></span>
      </div>
      <div class="budget-prompt" data-testid="budget-prompt" role="dialog" aria-modal="true" hidden>
        <div class="budget-card">
          <h2>How long can they watch?</h2>
          <div class="budget-options">
            <button type="button" data-testid="budget-option-20">20 min</button>
            <button type="button" data-testid="budget-option-30">30 min</button>
            <button type="button" data-testid="budget-option-45">45 min</button>
            <button type="button" data-testid="budget-option-other">Other…</button>
          </div>
          <form class="budget-custom" data-role="budget-custom" novalidate hidden>
            <label>Minutes (5–180)
              <input data-testid="budget-custom-input" type="number" inputmode="numeric" min="5" max="180" step="1" autocomplete="off">
            </label>
            <button type="submit" data-testid="budget-custom-start">Start</button>
            <p data-testid="budget-custom-error" hidden></p>
          </form>
          <button type="button" data-testid="budget-cancel">Cancel</button>
        </div>
      </div>
    </section>

    <section data-testid="screen-settings" data-state="locked" hidden>
      <header>
        <button type="button" data-testid="back-button">Back</button>
        <h1>Settings</h1>
      </header>
      <button type="button" data-testid="change-pin-button">Change PIN</button>
      <button type="button" data-testid="remove-pin-button" hidden>Remove PIN</button>
      <div class="feature-settings" data-role="feature-settings"></div>
      <ul data-role="settings-list"></ul>
    </section>

    <div data-testid="pin-prompt" data-mode="verify" data-state="entry" role="dialog" aria-modal="true" hidden>
      <form class="pin-card">
        <h2 data-role="pin-title">Enter PIN</h2>
        <input data-testid="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="6">
        <p data-testid="pin-error" hidden></p>
        <div class="pin-actions">
          <!-- Optional feature "faceId" (features/face-id.js) -->
          <button type="button" data-testid="pin-faceid-button" hidden>Use Face ID</button>
          <button type="button" data-testid="pin-faceid-setup-button" hidden>Set up Face ID again</button>
          <!-- First run on a device with Face ID / Touch ID -->
          <button type="button" data-testid="setup-faceid-button" hidden>Set up Face ID</button>
          <button type="button" data-testid="setup-pin-button" hidden>Use a PIN instead</button>
          <button type="button" data-testid="pin-cancel">Cancel</button>
          <button type="submit" data-testid="pin-submit">OK</button>
        </div>
      </form>
    </div>

  </div>
</body>
</html>
