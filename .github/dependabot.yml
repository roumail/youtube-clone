# Keeps pinned dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions   # bumps the pinned commit SHAs
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm              # CI test tooling only (Playwright, ESLint)
    directory: /
    schedule:
      interval: weekly
    groups:
      test-tooling:
        patterns: ["*"]
