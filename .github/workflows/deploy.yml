name: Deploy
# The run name carries the deployed commit; the rollback reads it back.
run-name: Deploy ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

# Publishes the app to GitHub Pages after CI passes on main, then checks the
# live site; if that fails, the previous good version is restored.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit to deploy (default: the current main)'
        required: false
      rollback:
        description: 'Set by the automatic rollback; disables a further rollback'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LIVE_URL: https://www.rohailtaimour.com/youtube-clone/

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - id: target
        env:
          INPUT_REF: ${{ inputs.ref }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=${INPUT_REF:-${RUN_SHA:-$GITHUB_SHA}}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      # Only commits on main that passed e2e are published.
      - name: Guard — commit is on main and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a full commit SHA"; exit 1; }
          git fetch -q origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          ok=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=e2e&filter=all" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          [ "${ok:-0}" -gt 0 ] || { echo "::error::$SHA has no successful e2e check"; exit 1; }
          echo "OK: $SHA is on main and passed e2e"

      - name: Assemble the public site (the M0 spike is not published)
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          mkdir _site
          rsync -a --exclude 'spike/' app/ _site/
          printf '{"commit":"%s"}\n' "$SHA" > _site/version.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Release gate after deploy: the public URL serves this exact commit, and the
  # app boots in the pinned Chrome on macOS without errors or CSP violations.
  verify-live:
    needs: deploy
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # Tooling comes from main's own checkout; the deployed commit is only
      # read as data (git show) for the comparison below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: pw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Wait until the CDN serves this commit
        env:
          SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          for i in $(seq 1 30); do
            got=$(curl -fsS -H 'Cache-Control: no-cache' "${LIVE_URL}version.json?t=$(date +%s)" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p' || true)
            [ "$got" = "$SHA" ] && { echo "live: $got"; exit 0; }
            echo "waiting for $SHA (live: ${got:-none})"; sleep 10
          done
          echo "the live site never served $SHA" >&2; exit 1

      - name: Live files match the commit byte for byte
        env:
          SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha"; exit 1; }
          fail=0
          while IFS= read -r -d '' f; do
            rel="${f#app/}"
            want=$(git show "$SHA:$f" | shasum -a 256 | cut -d' ' -f1)
            got=$(curl -fsS -H 'Cache-Control: no-cache' "${LIVE_URL}${rel// /%20}?v=$SHA" | shasum -a 256 | cut -d' ' -f1)
            if [ "$want" != "$got" ]; then echo "::error::MISMATCH $rel"; fail=1; fi
          done < <(git ls-tree -r -z --name-only "$SHA" -- app | grep -zv '^app/spike/')
          [ $fail -eq 0 ] && echo "all published files match $SHA"
          exit $fail

      - name: Smoke-test the live site (headed, like on the Mac)
        env:
          EXPECTED_SHA: ${{ needs.deploy.outputs.sha }}
          PW_HEADED: '1'
        run: npx playwright test

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # A failed live check rolls the site back to the last commit that deployed
  # and verified successfully. Never chains: a rollback doesn't roll back.
  rollback:
    needs: [deploy, verify-live]
    if: failure() && needs.deploy.result == 'success' && inputs.rollback != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      deployments: read
    steps:
      - name: Redeploy the previous good version
        env:
          GH_TOKEN: ${{ github.token }}
          BAD_SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          # A successful Deploy run = deployed AND verified live. Its name is "Deploy <sha>".
          good=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?status=success&per_page=30" \
            --jq '[.workflow_runs[].display_title | capture("^Deploy (?<sha>[0-9a-f]{40})$").sha] | map(select(. != env.BAD_SHA)) | .[0] // empty')
          if [ -z "$good" ]; then echo "no previous good deploy found; leaving the site as is" >&2; exit 1; fi
          echo "rolling back to $good"
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$good" -f rollback=true
          echo "::error::Live check failed for $BAD_SHA; rolled back to $good"
          exit 1
