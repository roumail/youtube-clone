name: Deploy
# The run name carries the deployed release; the rollback reads it back.
run-name: Deploy ${{ github.event.release.tag_name || inputs.tag }}

# The site runs exactly the latest release: publishing a GitHub Release (via
# tools/release.sh) deploys its tag, then the live site is checked; if that
# fails, the previous release is restored. Merges to main don't deploy.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)deploy, e.g. v1.0.0'
        required: true
      rollback:
        description: 'Set by the automatic rollback; disables a further rollback'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LIVE_URL: https://www.rohailtaimour.com/youtube-clone/

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only a release tag whose commit is on main and passed e2e is published.
      - id: target
        name: Guard — release tag on main, passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
          git fetch -q --tags origin main
          SHA=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}") || { echo "::error::tag $TAG not found"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx false \
            || { echo "::error::$TAG is not a published release"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$TAG ($SHA) is not on main"; exit 1; }
          ok=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=e2e&filter=all" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          [ "${ok:-0}" -gt 0 ] || { echo "::error::$TAG ($SHA) has no successful e2e check"; exit 1; }
          echo "OK: $TAG = $SHA, on main, passed e2e"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git checkout -q "$SHA"

      - name: Assemble the public site
        env:
          SHA: ${{ steps.target.outputs.sha }}
          TAG: ${{ steps.target.outputs.tag }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          mkdir _site
          rsync -a app/ _site/
          printf '{"version":"%s","commit":"%s"}\n' "$TAG" "$SHA" > _site/version.json
          # "Add from Google Drive" appears only when both values are set.
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_API_KEY" ]; then
            jq -n --arg clientId "$GOOGLE_CLIENT_ID" --arg apiKey "$GOOGLE_API_KEY" \
              '{clientId: $clientId, apiKey: $apiKey}' > _site/google.json
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Release gate after deploy: the public URL serves this exact commit, and the
  # app boots in the pinned Chrome on macOS without errors or CSP violations.
  # After deploy: the public URL serves exactly this commit, file for file.
  verify-files:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The deployed commit is only read as data (git show), never executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Wait until the CDN serves this commit
        env:
          SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          for i in $(seq 1 30); do
            got=$(curl -fsS -H 'Cache-Control: no-cache' "${LIVE_URL}version.json?t=$(date +%s)" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p' || true)
            [ "$got" = "$SHA" ] && { echo "live: $got"; exit 0; }
            echo "waiting for $SHA (live: ${got:-none})"; sleep 10
          done
          echo "the live site never served $SHA" >&2; exit 1

      - name: Live files match the commit byte for byte
        env:
          SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha"; exit 1; }
          fail=0
          while IFS= read -r -d '' f; do
            rel="${f#app/}"
            want=$(git show "$SHA:$f" | shasum -a 256 | cut -d' ' -f1)
            got=$(curl -fsS -H 'Cache-Control: no-cache' "${LIVE_URL}${rel// /%20}?v=$SHA" | shasum -a 256 | cut -d' ' -f1)
            if [ "$want" != "$got" ]; then echo "::error::MISMATCH $rel"; fail=1; fi
          done < <(git ls-tree -r -z --name-only "$SHA" -- app)
          [ $fail -eq 0 ] && echo "all published files match $SHA"
          exit $fail

  # After deploy: the live app boots cleanly in the pinned browser.
  verify-browser:
    needs: [deploy, verify-files]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579 # v1.65.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Smoke-test the live site
        env:
          EXPECTED_SHA: ${{ needs.deploy.outputs.sha }}
          EXPECTED_VERSION: ${{ needs.deploy.outputs.tag }}
        run: npx playwright test

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # A failed live check rolls the site back to the last commit that deployed
  # and verified successfully. Never chains: a rollback doesn't roll back.
  rollback:
    needs: [deploy, verify-files, verify-browser]
    if: failure() && needs.deploy.result == 'success' && inputs.rollback != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Redeploy the previous release
        env:
          GH_TOKEN: ${{ github.token }}
          BAD_TAG: ${{ needs.deploy.outputs.tag }}
        run: |
          # A successful Deploy run = deployed AND verified. Its name is "Deploy <tag>".
          good=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?status=success&per_page=30" \
            --jq '[.workflow_runs[].display_title | capture("^Deploy (?<tag>v[0-9]+[.][0-9]+[.][0-9]+)$").tag] | map(select(. != env.BAD_TAG)) | .[0] // empty')
          if [ -z "$good" ]; then echo "::error::Live check failed for $BAD_TAG and there is no earlier verified release to restore"; exit 1; fi
          echo "rolling back to $good"
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$good" -f rollback=true
          echo "::error::Live check failed for $BAD_TAG; rolled back to $good"
          exit 1
