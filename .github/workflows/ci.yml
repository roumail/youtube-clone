name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Media fixtures need no browser: generated in the preparation image
  # (Dockerfile, the same one users run), cached, and handed to e2e as an artifact.
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Workflow files are valid YAML (a broken deploy.yml silently stops deploys)
        run: |
          for f in .github/workflows/*.yml .github/dependabot.yml; do
            ruby -ryaml -e 'YAML.load_file(ARGV[0])' "$f" || { echo "::error file=$f::invalid YAML"; exit 1; }
          done

      - name: Restore fixtures (keyed on generator, preparation image and scripts)
        id: fx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures/out
          key: fixtures-${{ hashFiles('fixtures/generate.sh', 'Dockerfile', '.dockerignore', 'tools/run_prepare.sh', 'tools/prepare.sh', 'tools/pack.sh', 'tools/get-packager.sh', '.github/workflows/ci.yml') }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.fx-cache.outputs.cache-hit != 'true'

      - name: Build the preparation image (layers cached between runs)
        if: steps.fx-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kids-prepare
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate fixtures (via tools/prepare.sh, in the preparation image)
        if: steps.fx-cache.outputs.cache-hit != 'true'
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo
          -e PACKAGER=/tools/bin/packager --entrypoint /repo/fixtures/generate.sh kids-prepare

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures
          path: fixtures/out
          retention-days: 1

  # Required check on PRs: no credentials, personal data or media in the change.
  repo-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the PR's changes
        env:
          BASE: ${{ github.base_ref }}
        run: tools/check-hygiene.sh --range "origin/${BASE}...HEAD"

  # Required check on PRs: blocks adding dependencies with known vulnerabilities.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  # Required check. Mirrors the owner's Mac: macOS on Apple Silicon, Chrome
  # (pinned Playwright build) in a visible window, P3 screen emulated.
  e2e:
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Official Playwright image, pinned by digest: OS, system libraries and the
    # browser build can't drift. Must match @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579 # v1.65.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Lint specs (no sleeps allowed)
        run: npm run lint

      - name: Verify vendored Shaka matches the official npm release
        run: tools/verify-vendor.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
          path: fixtures/out

      - name: Run e2e (with line/branch coverage of app/)
        env:
          COVERAGE: '1'
        run: npx playwright test

      - name: Coverage table in the job summary
        if: always()
        run: if [ -f coverage-report/coverage-details.md ]; then cat coverage-report/coverage-details.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
