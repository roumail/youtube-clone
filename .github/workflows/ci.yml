name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint specs (no sleeps allowed)
        run: npm run lint

      - name: Cache Playwright browser (keyed on pinned version)
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install pinned Chromium + system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps only (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Restore fixtures (keyed on generator + tool versions)
        id: fx-cache
        uses: actions/cache@v6
        with:
          path: fixtures/out
          key: fixtures-${{ hashFiles('fixtures/generate.sh', 'fixtures/tools.txt') }}

      - name: Install pinned media tools
        if: steps.fx-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv /tmp/mediatools
          /tmp/mediatools/bin/pip install --quiet -r fixtures/tools.txt
          # Use the fully static ffmpeg, not the distro-specific hw-encoder build.
          FFPROBE=$(/tmp/mediatools/bin/python -c 'import streamer_binaries as b; print(b.ffprobe)')
          echo "FFMPEG=${FFPROBE/ffprobe-/ffmpeg-}" >> "$GITHUB_ENV"
          echo "PACKAGER=$(/tmp/mediatools/bin/python -c 'import streamer_binaries as b; print(b.packager)')" >> "$GITHUB_ENV"

      - name: Generate fixtures
        if: steps.fx-cache.outputs.cache-hit != 'true'
        run: fixtures/generate.sh

      - name: Run e2e
        run: npx playwright test

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
