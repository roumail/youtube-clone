name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Media fixtures need no browser: generated on the plain runner with pinned
  # static tools, cached, and handed to e2e as an artifact.
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Restore fixtures (keyed on generator + tool versions)
        id: fx-cache
        uses: actions/cache@v6
        with:
          path: fixtures/out
          key: fixtures-${{ hashFiles('fixtures/generate.sh', 'fixtures/tools.txt') }}

      - name: Install pinned media tools
        if: steps.fx-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv /tmp/mediatools
          /tmp/mediatools/bin/pip install --quiet -r fixtures/tools.txt
          # Use the fully static ffmpeg, not the distro-specific hw-encoder build.
          FFPROBE=$(/tmp/mediatools/bin/python -c 'import streamer_binaries as b; print(b.ffprobe)')
          echo "FFMPEG=${FFPROBE/ffprobe-/ffmpeg-}" >> "$GITHUB_ENV"
          echo "PACKAGER=$(/tmp/mediatools/bin/python -c 'import streamer_binaries as b; print(b.packager)')" >> "$GITHUB_ENV"

      - name: Generate fixtures
        if: steps.fx-cache.outputs.cache-hit != 'true'
        run: fixtures/generate.sh

      - uses: actions/upload-artifact@v7
        with:
          name: fixtures
          path: fixtures/out
          retention-days: 1

  # Required check. Runs inside the official Playwright image, pinned by digest:
  # OS, system libraries and the browser build cannot drift.
  e2e:
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # mcr.microsoft.com/playwright:v1.65.1-noble (must match @playwright/test in package.json)
      image: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint specs (no sleeps allowed)
        run: npm run lint

      - uses: actions/download-artifact@v8
        with:
          name: fixtures
          path: fixtures/out

      - name: Run e2e
        run: npx playwright test

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
