name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Media fixtures need no browser: generated on the plain runner with pinned
  # static ffmpeg + Shaka Packager binaries, cached, and handed to e2e as an artifact.
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Restore fixtures (keyed on generator, prepare script, packager pin)
        id: fx-cache
        uses: actions/cache@v6
        with:
          path: fixtures/out
          key: fixtures-${{ hashFiles('fixtures/generate.sh', 'tools/prepare.sh', 'tools/get-packager.sh', '.github/workflows/ci.yml') }}

      - name: Install pinned ffmpeg + Shaka Packager (static binaries, no apt)
        if: steps.fx-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: |
          # mwader/static-ffmpeg:9.0.2-1-amd64 (same ffmpeg version as the Mac), pinned by digest.
          IMG=mwader/static-ffmpeg@sha256:da43484f777f077a11f03f36a24ba56cb7b713d0f153dc488d434dab23d3d00c
          mkdir -p tools/bin
          docker create --name ff "$IMG" /ffmpeg >/dev/null
          docker cp ff:/ffmpeg tools/bin/ffmpeg
          docker cp ff:/ffprobe tools/bin/ffprobe
          docker rm ff >/dev/null
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"
          tools/get-packager.sh

      - name: Generate fixtures (via tools/prepare.sh)
        if: steps.fx-cache.outputs.cache-hit != 'true'
        run: fixtures/generate.sh

      - uses: actions/upload-artifact@v7
        with:
          name: fixtures
          path: fixtures/out
          retention-days: 1

  # Required check. Runs inside the official Playwright image, pinned by digest:
  # OS, system libraries and the browser build cannot drift.
  e2e:
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # mcr.microsoft.com/playwright:v1.65.1-noble (must match @playwright/test in package.json)
      image: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint specs (no sleeps allowed)
        run: npm run lint

      - uses: actions/download-artifact@v8
        with:
          name: fixtures
          path: fixtures/out

      - name: Run e2e
        run: npx playwright test

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
