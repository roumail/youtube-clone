name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Media fixtures need no browser: generated on the plain runner with pinned
  # static ffmpeg + Shaka Packager binaries, cached, and handed to e2e as an artifact.
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Workflow files are valid YAML (a broken deploy.yml silently stops deploys)
        run: |
          for f in .github/workflows/*.yml .github/dependabot.yml; do
            ruby -ryaml -e 'YAML.load_file(ARGV[0])' "$f" || { echo "::error file=$f::invalid YAML"; exit 1; }
          done

      - name: Restore fixtures (keyed on generator, prepare script, packager pin)
        id: fx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures/out
          key: fixtures-${{ hashFiles('fixtures/generate.sh', 'tools/prepare.sh', 'tools/pack.sh', 'tools/get-packager.sh', '.github/workflows/ci.yml') }}

      - name: Install pinned ffmpeg + Shaka Packager (static binaries, no apt)
        if: steps.fx-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: |
          # mwader/static-ffmpeg:9.0.2-1-amd64 (same ffmpeg version as the Mac), pinned by digest.
          IMG=mwader/static-ffmpeg@sha256:da43484f777f077a11f03f36a24ba56cb7b713d0f153dc488d434dab23d3d00c
          mkdir -p tools/bin
          docker create --name ff "$IMG" /ffmpeg >/dev/null
          docker cp ff:/ffmpeg tools/bin/ffmpeg
          docker cp ff:/ffprobe tools/bin/ffprobe
          docker rm ff >/dev/null
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"
          tools/get-packager.sh

      - name: Generate fixtures (via tools/prepare.sh)
        if: steps.fx-cache.outputs.cache-hit != 'true'
        run: fixtures/generate.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures
          path: fixtures/out
          retention-days: 1

  # Required check on PRs: no credentials, personal data or media in the change.
  repo-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the PR's changes
        env:
          BASE: ${{ github.base_ref }}
        run: tools/check-hygiene.sh --range "origin/${BASE}...HEAD"

  # Required check on PRs: blocks adding dependencies with known vulnerabilities.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  # Required check. Mirrors the owner's Mac: macOS on Apple Silicon, Chrome
  # (pinned Playwright build) in a visible window, P3 screen emulated.
  e2e:
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Official Playwright image, pinned by digest: OS, system libraries and the
    # browser build can't drift. Must match @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579 # v1.65.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Lint specs (no sleeps allowed)
        run: npm run lint

      - name: Verify vendored Shaka matches the official npm release
        run: tools/verify-vendor.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
          path: fixtures/out

      - name: Run e2e
        run: npx playwright test

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
